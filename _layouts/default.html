<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.short_title }} · UFAM</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-acronym">BDRI</span>
      <span class="brand-name">Databases and Information Retrieval Group<br><small>Institute of Computing · UFAM</small></span>
    </a>
    <nav>
      <a href="{{ '/' | relative_url }}">About</a>
      <a href="{{ '/people/' | relative_url }}">People</a>
      <a href="{{ '/publications/' | relative_url }}">Publications</a>
      <a href="{{ '/projects/' | relative_url }}">Projects</a>
      <a href="{{ '/contact/' | relative_url }}">Contact</a>
    </nav>
  </div>
</header>
<main class="wrap">
{{ content }}
</main>
<footer class="site-footer">
  <div class="wrap">
    <p>
      Certified research group in the
      <a href="http://dgp.cnpq.br/dgp/espelhogrupo/0567430607436726">CNPq Directory of Research Groups in Brazil</a>
      · <a href="https://icomp.ufam.edu.br/">Institute of Computing</a>
      · <a href="https://ufam.edu.br/">Federal University of Amazonas</a>
      · <a href="https://ppgi.ufam.edu.br/">PPGI</a>
    </p>
  </div>
</footer>
</body>
</html>
